name: Publish
on:
  release:
    types: [ released ]
  workflow_dispatch:
    inputs:
      publish_version:
        description: Version to publish (for example, 1.0.0)
        required: true
        type: string
jobs:
  publish:
    name: Release build and publish
    runs-on: macOS-latest
    environment: Prod
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Check signing secret availability
        env:
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
        run: |
          test -n "$SIGNING_KEY_ID" || { echo "::error::SIGNING_KEY_ID is unavailable"; exit 1; }
          echo "SIGNING_KEY_ID is available"
      - name: Prepare signing keyring
        env:
          SIGNING_KEY_RING_BASE64: ${{ secrets.SIGNING_KEY_RING_BASE64 }}
        run: |
          test -n "$SIGNING_KEY_RING_BASE64"
          printf '%s' "$SIGNING_KEY_RING_BASE64" | base64 --decode > "$RUNNER_TEMP/secring.gpg"
          chmod 600 "$RUNNER_TEMP/secring.gpg"
      - name: Publish to MavenCentral
        run: bash ./gradlew -Psigning.keyId="$SIGNING_KEY_ID" publishAndReleaseToMavenCentral --no-configuration-cache --stacktrace
        env:
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_PUBLISH_VERSION: ${{ github.event.release.tag_name || inputs.publish_version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USER_NAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signing.password: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signing.secretKeyRingFile: ${{ runner.temp }}/secring.gpg
